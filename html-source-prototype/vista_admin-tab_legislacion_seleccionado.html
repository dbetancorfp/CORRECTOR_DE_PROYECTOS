<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
</head>
<body>
    <section>
        <nav>
            <img src="" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <!-- Tabs- tab Legislación seleccionado -->
        <button type="button" id="legislation">Legislación</button>
        <button type="button" id="cicles">Ciclos</button>
        <button type="button" id="modules">Módulos</button>
        <button type="button" id="teachers">Profesorado</button>

        <div>
            <label for="nameLaw"></label>
            <input type="text" name="nameLaw" id="nameLaw" placeholder="Siglas de la legislación">
            <label for="academicYear"></label>
            <input type="text" name="firstYearAcademicLaw" id="firstYearAcademicLaw" placeholder="Año de inicio de la legislación">
            <input type="text" name="lastYearAcademicLaw" id="lastYearAcademicLaw" placeholder="Año de finalización de la legislación">
            <button type="submit">Guardar</button>
        </div>
    </section>
</body>
</html>
