sonar.projectKey=dbetancorfp_CORRECTOR_DE_PROYECTOS
sonar.organization=dbetancorfp
sonar.projectName=Corrector de Proyectos

# ── Fuentes ──────────────────────────────────────────────────────────────────
# Raíz del proyecto; se excluye todo lo que no es código fuente TypeScript/JS
sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/site/**,\
  **/coverage/**,\
  corrector/01-boceto/**,\
  corrector/02-conversacion-cliente/**,\
  corrector/03-generated-artifacts/**,\
  corrector/04-use-cases/**,\
  docs/**,\
  **/*.css,\
  **/*.html,\
  **/*.md,\
  **/*.sql,\
  **/*.json

# ── Tests ─────────────────────────────────────────────────────────────────────
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts

# ── Cobertura (LCOV generado por bun test --coverage) ────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── TypeScript ────────────────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.json

# ── Codificación ─────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
