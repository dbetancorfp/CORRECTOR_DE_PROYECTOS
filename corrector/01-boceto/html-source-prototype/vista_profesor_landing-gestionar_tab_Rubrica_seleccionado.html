<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
    <link rel="stylesheet" href="boceto.css">
</head>
<body>
    <section>
        <nav>
            <img src="./assets/logo-departamento_solo_transparente.png" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <!-- Tabs- tab Rúbrica seleccionado -->
        <div class="tabs">
            <button type="button" id="pupils">Alumnos</button>
            <button type="button" id="proyects">Proyectos</button>
            <button type="button" id="asignacion">Asignación Proyecto-Alumno</button>
            <button class="clicked" type="button" id="items">Rúbrica</button>
        </div>

        <div >
            <fieldset class="form-row">
                <legend>Filtrar por módulo:</legend>    
                <input type="text" name="namePupil" id="namePupilFilter" data-element-id="86" placeholder="Filtrar por proyecto">

                <select name="firstYearAcademicLaw" id="firstYearAcademicLaw" data-element-id="87">
                        <option value="">Seleccionar año</option>
                        <option value="2024">2024</option>
                        <option value="2026">2026</option>
                </select>

                <select name="Law" id="Law" data-element-id="88">
                    <option value="">Seleccionar legislación</option>
                    <option value="law1">LOE</option>
                    <option value="law2">LOMLOE</option>
                </select>

                <!--Desplegable para seleccionar el ciclo-->
                <select name="cicle" id="cicle" data-element-id="89">
                    <option value="">Seleccionar ciclo</option>
                    <option value="1">Desarrollo de aplicaciones web (DAW)</option>
                    <option value="2">Desarrollo de aplicaciones multiplanatormas (DAM)</option> 
                    <option value="2">Sistemas de aplicaciones informáticas (ASR)</option>
                </select>
                <!--Desplegable para seleccionar el módulo filtrado por ciclo-->
                <select name="module" id="module" data-element-id="90">
                    <option value="">Seleccionar módulo</option>
                    <option value="1">Sistemas informáticos (SSF)</option>
                    <option value="2">Digitalización (DJK)</option> 
                    <option value="2">Despliegue</option>
                </select>
            </fieldset>   
        </div>


        <div >
            <fieldset class="form-row">
                <legend>Nuevo item:</legend> 
                <div style="display: flex; justify-content: right;">
                    <button type="button" data-element-id="91">Nuevo nivel</button>
                </div>
                <div>
                    <table class="rubrictable" data-element-id="92">
                        <tr>
                            <th>Item</th>
                            <th>Excelente</th>
                            <th>Bien</th>
                            <th>Mal</th>
                            <th>Borrar</th>
                        </tr>
                        <tr>
                            <td data-element-id="93">Uso de lenguaje técnico en la presentación</td>
                            <td data-element-id="94">2</td>
                            <td data-element-id="95">1</td>
                            <td data-element-id="96">0</td>
                            <td data-element-id="97">Icono borrar</td>
                        </tr>
                    </table>
                </div>
                <div class="buttons-to-extreme">
                    <button type="button" data-element-id="98">Añadir item</button>
                    <button type="button" data-element-id="99">Subir rúbrica</button>
                </div>
            </fieldset>
        </div>

        <div style="width: 100%;">
          <table style="border: 1px solid black; border-collapse: collapse;" data-element-id="100">
            <tr> 
                <th>Item</th>
                <th>Excelente</th>
                <th>Muy bien</th>
                <th>Bien</th>
                <th>Regular</th>
                <th>Mal</th>
                <th>Editar</th>
                <th>Borrar</th>
            </tr>
            <tr>
                <td>Documentación completa</td>
                <td>2</td>
                <td>1.75</td>
                <td>1</td>
                <td>0.5</td>
                <td>0</td>
                <td>Icono editar</td>
                <td>Icono borrar</td>
            </tr>
          </table>

        </div>
    </section>
</body>
</html>
