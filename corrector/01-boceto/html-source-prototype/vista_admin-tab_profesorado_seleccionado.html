<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
    <link rel="stylesheet" href="boceto.css">
</head>
<body>
    <section>
        <nav>
            <img src="./assets/logo-departamento_solo_transparente.png" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <!-- Tabs- tab Profesorado seleccionado -->
        <div class="tabs">
            <button type="button" id="legislation">Legislación</button>
            <button type="button" id="cicles">Ciclos</button>
            <button type="button" id="modules">Módulos</button>
            <button class="clicked" type="button" id="teachers" data-element-id="23">Profesorado</button>
        </div>

        <div>
            <form action="">
                <fieldset class="form-row">
                    <legend>Nuevo profesor:</legend>
                    <input type="text" name="nameTeacher" id="nameTeacher" data-element-id="7" placeholder="Nombre del profesor">
                    <input type="password" name="passwordTeacher" id="passwordTeacher" data-element-id="8" placeholder="Contraseña">
                    <!--Desplegable para seleccionar el ciclo-->
                    <select name="cicle" id="cicle" data-element-id="68">
                        <option value="">Seleccionar proyecto</option>
                        <option value="1">Desarrollo de aplicaciones web (DAW)</option>
                        <option value="2">Desarrollo de aplicaciones multiplanatormas (DAM)</option> 
                        <option value="2">Sistemas de aplicaciones informáticas (ASR)</option>
                    </select>
                    <!--Desplegable para seleccionar el módulo filtrado por ciclo-->
                    <select name="module" id="module" data-element-id="68">
                        <option value="">Seleccionar proyecto</option>
                        <option value="1">Sistemas informáticos (SSF)</option>
                        <option value="2">Digitalización (DJK)</option> 
                        <option value="2">Despliegue</option>
                    </select>
                    <input type="submit" value="Guardar">
                </fieldset>
            </form>
        </div>


       <fieldset class="form-row">
            <legend>Filtrar por:</legend>    
                <input type="text" name="filterYearInit" id="filterYearInit" data-element-id="33" placeholder="Filtrar por año de inicio">
                <input type="text" name="filterLaw" id="filterLaw" data-element-id="34" placeholder="Filtrar por legislación">
                <input type="text" name="filterCicle" id="filterCicle" data-element-id="33" placeholder="Filtrar por ciclo">
                <input type="text" name="nameModule" id="nameModule" data-element-id="7" placeholder="Filtrar por módulo">
        </fieldset>   


        <div>
          <table style="border: 1px solid black;" data-element-id="25">
            <tr>
                <th>Nombre</th>
                <th>Contraseña</th>
                <th data-element-id="26">Ciclo</th>
                <th data-element-id="27">Módulos</th>
                <th data-element-id="28">Editar</th>
                <th data-element-id="29">Borrar</th>
            </tr>
            <tr>
                <td>dbetqui</td>
                <td>12345678</td>
                <td>Desarrollo de aplicaciones web</td>
                <td>DEW</td>
                <td>Icono editar</td>
                <td>Icono borrar</td>
            </tr>
          </table>
        </div>
    </section>
</body>
</html>
