<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
    <link rel="stylesheet" href="boceto.css">
</head>
<body>
    <section>
        <nav>
            <img src="./assets/logo-departamento_solo_transparente.png" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <!-- Tabs- tab Módulos seleccionado -->
        <div class="tabs">
            <button type="button" id="legislation">Legislación</button>
            <button type="button" id="cicles">Ciclos</button>
            <button class="clicked" type="button" id="modules" data-element-id="21">Módulos</button>
            <button type="button" id="teachers">Profesorado</button>
        </div>

        <div>
            <form action="">
                <fieldset class="form-row">
                    <legend>Nuevo módulo:</legend>
                    <input type="text" name="nameModule" id="nameModule" data-element-id="22" placeholder="Nombre del módulo">
                    <select name="cicle" id="cicle" data-element-id="23">
                        <option value="">Seleccionar ciclo</option>
                        <option value="cicle1">Desarrollo de aplicaciones web (DEW)</option>
                        <option value="cicle2">Desarrollo de aplicaciones multiplataformas (DAM)</option>
                    </select>

                    <select name="firstYearAcademicLaw" id="firstYearAcademicLaw" data-element-id="24">
                        <option value="">Seleccionar año</option>
                        <option value="2024">2024</option>
                        <option value="2026">2026</option>
                    </select>

                    <select name="Law" id="Law" data-element-id="25">
                        <option value="">Seleccionar legislación</option>
                        <option value="law1">LOE</option>
                        <option value="law2">LOMLOE</option>
                    </select>
                    <input type="submit" data-element-id="26" value="Guardar">
                </fieldset>
            </form>
        </div>


       <fieldset class="form-row">
            <legend>Filtrar por:</legend>    
                <input type="text" name="filterYearInit" id="filterYearInit" data-element-id="27" placeholder="Filtrar por año de inicio">
                <input type="text" name="filterLaw" id="filterLaw" data-element-id="28" placeholder="Filtrar por legislación">
                <input type="text" name="filterCicle" id="filterCicle" data-element-id="29" placeholder="Filtrar por ciclo">
                <input type="text" name="nameModule" id="nameModule" data-element-id="30" placeholder="Filtrar por módulo">
        </fieldset>   
        

        <div>
          <table style="border: 1px solid black;" data-element-id="31">
            <tr>
                <th>Módulo</th>
                <th>Ciclo</th>  
                <th>Año de inicio</th>
                <th>Legislación</th>
                <th>Horas semanales</th>
                <th>Editar</th>
                <th>Borrar</th>
            </tr>
            <tr>
                <td>Sistemas informáticos (SSF)</td>
                <td>Desarrollo de aplicaciones web (DEW)</td>
                <td>2026</td>
                <td>LOMLOE</td>
                <td>5</td>
                <td>Icono editar</td>
                <td>Icono borrar</td>
            </tr>
          </table>
        </div>
    </section>
</body>
</html>
