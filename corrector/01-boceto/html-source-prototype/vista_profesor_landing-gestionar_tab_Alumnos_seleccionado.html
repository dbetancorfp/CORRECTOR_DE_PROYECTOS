<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
    <link rel="stylesheet" href="boceto.css">
</head>
<body>
    <section>
        <nav>
            <img src="./assets/logo-departamento_solo_transparente.png" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <!-- Tabs- tab Alumnos seleccionado -->
        <div class="tabs">
            <button type="button" id="pupils" data-element-id="31">Alumnos</button>
            <button type="button" id="proyects">Proyectos</button>
            <button type="button" id="items">Rúbrica</button>
        </div>

        <div class="filters">
            <!--Filtros reactivos-->
            <input type="text" name="filterName" id="filterName" data-element-id="32" placeholder="Filtrar por nombre">
            <input type="text" name="filterCicle" id="filterCicle" data-element-id="33" placeholder="Filtrar por ciclo">
            <input type="text" name="filterLaw" id="filterLaw" data-element-id="34" placeholder="Filtrar por legislación">
            <button type="button" data-element-id="35">Nuevo</button>
        </div>
        <div>
          <table style="border: 1px solid black;" data-element-id="36">
            <tr>
                <th>Nombre</th>
                <th data-element-id="37">Ciclo</th>
                <th data-element-id="38">Legislación</th>
                <th data-element-id="39">Editar</th>
                <th data-element-id="40">Borrar</th>
            </tr>
            <tr>
                <td>JJ499</td>
                <td>Desarrollo de aplicaciones web</td>
                <td>LOMLOE</td>
                <td>Icono editar</td>
                <td>Icono borrar</td>
            </tr>
          </table>
          <button type="button" data-element-id="41">Subir lista de alumnos</button>
        </div>
    </section>
</body>
</html>
