<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
    <link rel="stylesheet" href="boceto.css">
</head>
<body>
    <section>
        <nav>
            <img src="./assets/logo-departamento_solo_transparente.png" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <!-- Tabs- tab Alumnos seleccionado -->
        <div class="tabs">
            <button class="clicked" type="button" id="pupils">Alumnos</button>
            <button type="button" id="proyects">Proyectos</button>
            <button type="button" id="asignacion">Asignación Proyecto-Alumno</button>
            <button type="button" id="items">Rúbrica</button>
        </div>

        <form action="">
            <fieldset class="form-row">
                <legend>Nuevo alumno:</legend>
                    <input type="text" name="namePupil" id="namePupil" data-element-id="48" placeholder="Nombre del alumno">

                <select name="firstYearAcademicLaw" id="firstYearAcademicLaw" data-element-id="49">
                        <option value="">Seleccionar año</option>
                        <option value="2024">2024</option>
                        <option value="2026">2026</option>
                </select>

                <select name="Law" id="Law" data-element-id="50">
                    <option value="">Seleccionar legislación</option>
                    <option value="law1">LOE</option>
                    <option value="law2">LOMLOE</option>
                </select>

                <!--Desplegable para seleccionar el ciclo-->
                <select name="cicle" id="cicle" data-element-id="51">
                    <option value="">Seleccionar ciclo</option>
                    <option value="1">Desarrollo de aplicaciones web (DAW)</option>
                    <option value="2">Desarrollo de aplicaciones multiplanatormas (DAM)</option> 
                    <option value="2">Sistemas de aplicaciones informáticas (ASR)</option>
                </select>
                <!--Desplegable para seleccionar el módulo filtrado por ciclo-->
                <select name="module" id="module" data-element-id="52">
                    <option value="">Seleccionar módulo</option>
                    <option value="1">Sistemas informáticos (SSF)</option>
                    <option value="2">Digitalización (DJK)</option> 
                    <option value="2">Despliegue</option>
                </select>
                <div>
                    <button type="button" data-element-id="53">Nuevo</button>
                    <button type="button" data-element-id="54" data-accept="csv,json,yaml">Subir lista de alumnos</button>
                </div>
                    
            </fieldset>
        </form>

        <div>
        <fieldset class="form-row">
            <legend>Filtrar por:</legend>    
                <input type="text" name="namePupil" id="namePupilFilter" data-element-id="55" placeholder="Filtrar por nombre">

                <select name="firstYearAcademicLaw" id="firstYearAcademicLaw" data-element-id="56">
                        <option value="">Seleccionar año</option>
                        <option value="2024">2024</option>
                        <option value="2026">2026</option>
                </select>

                <select name="Law" id="Law" data-element-id="57">
                    <option value="">Seleccionar legislación</option>
                    <option value="law1">LOE</option>
                    <option value="law2">LOMLOE</option>
                </select>

                <!--Desplegable para seleccionar el ciclo-->
                <select name="cicle" id="cicle" data-element-id="58">
                    <option value="">Seleccionar ciclo</option>
                    <option value="1">Desarrollo de aplicaciones web (DAW)</option>
                    <option value="2">Desarrollo de aplicaciones multiplanatormas (DAM)</option> 
                    <option value="2">Sistemas de aplicaciones informáticas (ASR)</option>
                </select>
                <!--Desplegable para seleccionar el módulo filtrado por ciclo-->
                <select name="module" id="module" data-element-id="59">
                    <option value="">Seleccionar módulo</option>
                    <option value="1">Sistemas informáticos (SSF)</option>
                    <option value="2">Digitalización (DJK)</option> 
                    <option value="2">Despliegue</option>
                </select>


            </fieldset>   
        </div>

        <div>
          <table style="border: 1px solid black;" data-element-id="60">
            <tr>
                <th>Nombre</th>
                <th>Módulo</th>
                <th>Ciclo</th>
                <th>Legislación</th>
                <th>Año de inicio</th>
                <th>Editar</th>
                <th>Borrar</th>
            </tr>
            <tr>
                <td>Michael Knight</td>
                <td>Desarrollo del lado del cliente (DEW)</td>
                <td>Desarrollo de aplicaciones web (DAW)</td>
                <td>LOMLOE</td>
                <td>2025</td>
                <td>Icono editar</td>
                <td>Icono borrar</td>
            </tr>
          </table>
          
        </div>
    </section>
</body>
</html>
