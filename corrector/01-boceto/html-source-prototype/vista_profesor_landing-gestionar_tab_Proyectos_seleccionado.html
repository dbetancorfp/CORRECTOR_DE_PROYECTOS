<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
    <link rel="stylesheet" href="boceto.css">
</head>
<body>
    <section>
        <nav>
            <img src="" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <button type="button" data-element-id="42">Seleccionar módulo</button>
        <!-- Tabs- tab Proyectos seleccionado -->
        <div class="tabs">
            <button type="button" id="pupils">Alumnos</button>
            <button type="button" id="proyects">Proyectos</button>
            <button type="button" id="items">Rúbrica</button>
        </div>

        <div class="filters">
            <!--Filtros reactivos-->
            <input type="text" name="filterProject" id="filterProject" data-element-id="43" placeholder="Filtrar por proyecto">
            <input type="text" name="filterYear" id="filterYear" data-element-id="44" placeholder="Filtrar por año">
            <input type="text" name="filterLaw" id="filterLaw" data-element-id="45" placeholder="Filtrar por legislación">
            <button type="button" data-element-id="46">Nuevo</button>
        </div>
        <div>
          <table style="border: 1px solid black;" data-element-id="47">
            <tr>
                <th>Nombre</th>
                <th data-element-id="48">Alumnado</th>
                <th data-element-id="49">añadir alumnado</th>
                <th data-element-id="50">Editar</th>
                <th data-element-id="51">Borrar</th>
            </tr>
            <tr>
                <td>Grupo 1</td>
                <td><li><ul>JJ43</ul><ul>MnP454<ul></li></td>
                <td>Icono rueda dentada</td>
                <td>Icono editar</td>
                <td>Icono borrar</td>
            </tr>
          </table>
        </div>
    </section>
</body>
</html>
