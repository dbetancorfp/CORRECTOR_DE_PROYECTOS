<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
    <link rel="stylesheet" href="boceto.css">
</head>
<body>
    <section>
        <nav>
            <img src="./assets/logo-departamento_solo_transparente.png" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <!-- Tabs- tab Ciclos seleccionado -->
        <div class="tabs">
            <button class="clicked" type="button" id="legislation" data-element-id="4">Legislación</button>
            <button type="button" id="cicles" >Ciclos</button>
            <button type="button" id="modules">Módulos</button>
            <button type="button" id="teachers">Profesorado</button>
        </div>

        <br>

        <div>
            <form action="">
                <fieldset class="form-row">
                    <legend>Nueva legislación:</legend>
                    <input type="text" name="nameCicle" id="nameCicle" data-element-id="5" placeholder="Nombre del ciclo">
                    <input type="text" name="firstYearAcademicLaw" id="firstYearAcademicLaw" data-element-id="6" placeholder="Año de inicio de la legislación">
                    <input type="submit" data-element-id="7" value="Guardar">
                </fieldset>
            </form>
        </div>

        <br>

        <fieldset class="form-row">
            <legend>Filtrar por:</legend>
                <!--Filtros reactivos-->
                <input type="text" name="filterYearInit" id="filterYearInit" data-element-id="8" placeholder="Filtrar por año de inicio">
                <input type="text" name="filterLaw" id="filterLaw" data-element-id="9" placeholder="Filtrar por legislación">
        </fieldset>


        <div>
          <table class="table" style="border: 1px solid black;" data-element-id="10">
            <tr>
                <th>Año incial</th>
                <th>Nombre</th>
                <th>Editar</th>
                <th>Borrar</th>
            </tr>
            <tr>
                <td>2025</td>
                <td>LOE</td>
                <td>Icono editar</td>
                <td>Icono borrar</td>
            </tr>
            <tr>
                <td>2026</td>
                <td>LOMLOE</td>
                <td>Icono editar</td>
                <td>Icono borrar</td>
            </tr>
          </table>
        </div>
    </section>
</body>
</html>
