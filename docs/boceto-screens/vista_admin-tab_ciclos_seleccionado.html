<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de proyectos</title>
    <link rel="stylesheet" href="boceto.css">
</head>
<body>
    <section>
        <nav data-element-id="11">
            <img src="./assets/logo-departamento_solo_transparente.png" alt="logo">
            <div><p><h1>Corrector de proyectos</h1></p></div>
            <div><p><h3>Bienvenido</h3></p></div>
            <div><p><h4>Fulanito</h4></p></div>
            <button type="button">Salir</button>
        </nav>
    </section>
    <section>
        <div><p><h2>Gestión</h2></p></div>
        <!-- Tabs- tab Legislación seleccionado -->
        <div class="tabs" >
            <button type="button" id="legislation">Legislación</button>
            <button class="clicked" type="button" id="cicles" data-element-id="12">Ciclos</button>
            <button type="button" id="modules">Módulos</button>
            <button type="button" id="teachers">Profesorado</button>
        </div>

        <div>
            <form action="">
                <fieldset class="form-row">
                    <legend>Nuevo ciclo:</legend>
                    <input type="text" name="nameCicle" id="nameCicle" data-element-id="13" placeholder="Nombre del ciclo">
                    <select name="firstYearAcademicLaw" id="firstYearAcademicLaw" data-element-id="14">
                        <option value="">Seleccionar año</option>
                        <option value="2024">2024</option>
                        <option value="2026">2026</option>
                    </select>

                    <select name="Law" id="Law" data-element-id="15">
                        <option value="">Seleccionar legislación</option>
                        <option value="law1">LOE</option>
                        <option value="law2">LOMLOE</option>
                    </select>
                    <input type="submit" data-element-id="16" value="Guardar">
                </fieldset>
            </form>
        </div>

       <fieldset class="form-row">
            <legend>Filtrar por:</legend>       
                <input type="text" name="firstYearAcademicLaw" id="firstYearAcademicLaw" data-element-id="17" placeholder="Filtrar por año de inicio de la legislación">
                <input type="text" name="nameLaw" id="nameLaw" data-element-id="18" placeholder="Filtrar por legislación">
                <input type="text" name="nameCicle" id="nameCicle" data-element-id="19" placeholder="Filtrar por ciclo">              
        </fieldset>       

        <div>
            <table class="table" style="border: 1px solid black;" data-element-id="20">
                <tr>
                    <th>Ciclo</th>
                    <th>Siglas</th>
                    <th>Año inicio</th>
                    <th data-element-id="21">Año finalización</th>
                    <th>Editar</th>
                    <th>Borrar</th>
                </tr>
                <tr>
                    <td>Desarrollo de aplicaciones web (DEW)</td>
                    <td>LOE</td>
                    <td>2024</td>
                    <td>2025</td>
                    <td>Icono editar</td>
                    <td>Icono borrar</td>
                </tr>
                <tr>
                    <td>Desarrollo de aplicaciones web (DEW)</td>
                    <td>LOMLOE</td>
                    <td>2025</td>
                    <td>2026</td>
                    <td>Icono editar</td>
                    <td>Icono borrar</td>
                </tr>
            </table>
        </div>
    </section>
</body>
</html>
