<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casos de Uso · Corrector de Proyectos</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    /* ── UC index at top ── */
    .uc-index {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .6rem;
      margin: 1rem 0 2rem;
    }
    .uc-index-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .6rem .9rem;
      text-decoration: none;
      color: var(--text);
      font-size: .85rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: .5rem;
      transition: box-shadow .15s, transform .15s;
    }
    .uc-index-item:hover {
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      transform: translateY(-1px);
    }
    .uc-id {
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }
    .uc-title-sm { font-size: .84rem; color: var(--muted); }

    /* ── UC section ── */
    .uc-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      overflow: hidden;
    }
    .uc-header {
      background: var(--primary);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .uc-header-id {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 800;
      color: rgba(255,255,255,.6);
    }
    .uc-header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      flex: 1;
    }
    .uc-body { padding: 1.25rem 1.5rem; }

    /* ── Meta row ── */
    .uc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1.5rem;
      margin-bottom: 1.25rem;
      font-size: .85rem;
    }
    .uc-meta-item { display: flex; gap: .4rem; align-items: baseline; }
    .uc-meta-key {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      flex-shrink: 0;
    }
    .uc-meta-val { color: var(--text); }
    .uc-sketch-tags { display: flex; flex-wrap: wrap; gap: .3rem; }
    .uc-sketch-tag {
      font-family: var(--mono);
      font-size: .74rem;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      padding: .08rem .4rem;
    }

    /* ── Subsections ── */
    .uc-sub { margin-bottom: 1.1rem; }
    .uc-sub-title {
      font-size: .73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: .5rem;
      padding-bottom: .25rem;
      border-bottom: 1px solid var(--border);
    }
    .uc-flow-list {
      list-style: decimal;
      padding-left: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .uc-flow-list li { font-size: .88rem; line-height: 1.55; }
    .uc-alt-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }
    .uc-alt-list li {
      font-size: .87rem;
      line-height: 1.5;
      padding: .45rem .8rem;
      background: var(--bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .uc-alt-id {
      font-family: var(--mono);
      font-weight: 700;
      font-size: .78rem;
      color: var(--accent);
    }
    .uc-post-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .uc-post-list li {
      font-size: .87rem;
      padding: .3rem 0;
      display: flex;
      gap: .5rem;
    }
    .uc-post-list li::before { content: '→'; color: var(--accent); font-weight: 700; }
    .uc-crit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .uc-crit-list li {
      font-size: .85rem;
      line-height: 1.5;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .45rem .8rem;
      display: flex;
      gap: .55rem;
      align-items: flex-start;
    }
    .uc-crit-list li::before {
      content: '☐';
      flex-shrink: 0;
      color: var(--muted);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .uc-index { grid-template-columns: 1fr 1fr; gap: .4rem; }
      .uc-header { padding: .75rem 1rem; }
      .uc-body { padding: .9rem 1rem; }
      .uc-header-title { font-size: .95rem; }
      .uc-meta { gap: .4rem .9rem; }
    }
  </style>
</head>
